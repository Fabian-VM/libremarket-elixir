services:
  simulador:
    image: elixir:otp-27-alpine
    container_name: simulador
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
      CLOUDAMQP_URL: ${CLOUDAMQP_URL}
    command: iex --sname simulador --cookie secret -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

  ui:
    image: elixir:otp-27-alpine
    container_name: ui
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      SERVER_TO_RUN: Libremarket.Ui.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
      CLOUDAMQP_URL: ${CLOUDAMQP_URL}
