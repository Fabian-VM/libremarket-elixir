services:
  compras:
    image: elixir:1.19-alpine
    container_name: compras
    volumes:
      - ./:/app
    working_dir: /app
    network_mode: "host"
    environment:
      SERVER_TO_RUN: Libremarket.Compras.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
    command: iex --name compras@127.0.0.1 --cookie secret -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

  infracciones:
    image: elixir:1.19-alpine
    container_name: infracciones
    volumes:
      - ./:/app
    working_dir: /app
    network_mode: "host"
    environment:
      SERVER_TO_RUN: Libremarket.Infracciones.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
    command: iex --name infracciones@127.0.0.1 --cookie secret -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

